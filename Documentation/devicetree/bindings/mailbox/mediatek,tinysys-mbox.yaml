%YAML 1.2
---
$id: http://devicetree.org/schemas/mailbox/mediatek,tinysys-mbox.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek TinySys mailbox controller

maintainers:
  - Hailong Fan <Hailong.Fan@mediatek.com>

description: |
  The MediaTek tinysys-mbox Inter-Processor Communication (IPC) enables the SoC
  to communicate with the Tiny System (tinysys) by passing messages through
  multiple mailbox channels. The MediaTek tinysys-mbox IPC also provides the
  ability for one processor to signal the other processor using interrupts.
  This mailbox controller is typically used as a communication mechanism
  between the main processor and tinysys subsystems, and is often managed
  under the SCMI (System Control and Management Interface) framework.

properties:
  compatible:
    - const: mediatek,tinysys_mbox

  "#mbox-cells":
    const: 1

  reg:
    minItems: 2
    maxItems: 2

  shmem:
    minItems: 2
    maxItems: 2
    description: |
      References to the shared memory regions used for SCMI message
      transmission (TX) and reception (RX).

  interrupts:
    minItems: 2
    maxItems: 2

required:
  - compatible
  - reg
  - shmem
  - interrupts
  - "#mbox-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        tinysys_mbox: tinysys-mbox@1c351000 {
            compatible = "mediatek,tinysys_mbox";
            reg = <0 0x1c351000 0 0x1000>,
                  <0 0x1c361000 0 0x1000>;
            shmem = <&scmi_tx_shmem>, <&scmi_rx_shmem>;
            interrupts = <0 509 4>,
                         <0 510 4>;
            #mbox-cells = <1>;
        };
    };
